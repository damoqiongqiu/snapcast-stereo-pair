name: Runtime feature request
description: Propose a capability or change for the audio runtime
title: "[Feature]: "
labels: []
body:
  - type: textarea
    id: use-case
    attributes:
      label: Use case
      description: What user problem should this solve?
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Proposed scope
      description: Describe capture, stream, service, installation, or documentation impact.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Audio runtime
        - Native macOS console
        - Installation and packaging
        - Documentation only
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: textarea
    id: risks
    attributes:
      label: Quality, latency, security, or compatibility risks

