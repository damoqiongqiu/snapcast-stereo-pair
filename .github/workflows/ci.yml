name: CI

on:
  push:
  pull_request:

jobs:
  runtime:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: brew install cmake ninja pkgconf boost openssl@4 portaudio
      - name: Configure tests
        run: |
          cmake -S . -B .build-ci -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DBUILD_SERVER=OFF \
            -DBUILD_CLIENT=ON \
            -DBUILD_TESTS=ON \
            -DBUILD_WITH_SSL=OFF \
            -DBUILD_WITH_FLAC=OFF \
            -DBUILD_WITH_VORBIS=OFF \
            -DBUILD_WITH_OPUS=OFF \
            -DBUILD_WITH_AVAHI=OFF \
            -DBUILD_WITH_EXPAT=OFF \
            -DBUILD_WITH_ALSA=OFF \
            -DBUILD_SHARED_LIBS=OFF \
            -DBUILD_STATIC_LIBS=ON
      - name: Build and unit tests
        run: |
          cmake --build .build-ci -j 4
          ./bin/snapcast_test --reporter compact
      - name: Build macOS integration
        run: ./integration/scripts/build-macos.sh
      - name: Native tests and release build
        run: |
          swift test --package-path native
          swift build --package-path native -c release
      - name: Pair tests
        run: |
          integration/test/test-pair-config.sh
          integration/test/test-audio-levels.sh
          integration/test/test-pair-routing.sh
          integration/test/test-wake-recovery.sh
          integration/test/test-control-plane.sh
          integration/test/test-mode-transitions.sh
          integration/test/test-control-agent-install.sh
          integration/test/test-native-app-packaging.sh
          integration/test/test-homebrew-formula.sh
          integration/test/test-native-release.sh --automated-only
      - name: Validate shell and plists
        run: |
          zsh -n integration/scripts/*.sh integration/test/*.sh
          for file in integration/launchagents/*.plist.in; do
            plutil -lint "$file"
          done
      - name: Public tree scan
        run: ./scripts/check-public-tree.sh
